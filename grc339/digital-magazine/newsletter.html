<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/CSS" href="style.css">
    <title>Vision</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="https://use.typekit.net/uix3ecm.css">
  </head>
  <body>
    <div class="newsletter-container">
      <header>
        <h1><a href="index.html"><img src="Vision Logo.svg" alt="Vision Magazine Logo."></a></h1>
        <nav>
          <ul>
            <li><a href="mainstory.html">Features & Editorials</a></li>
            <li><a href="fashion.html">Fashion</a></li>
            <li><a href="culture.html">Culture</a></li>
            <li><a href="photogallery.html">The Gallery</a></li>
            <li><a href="history.html">History</a></li>
          </ul>
        </nav>
      </header>
      <main class="newsletter"><img src="Monogram Logo.svg" alt="Vision V monogram.">
        <form>
          <section class="Intro">
            <h2>Newsletter Sign Up Form</h2>
          </section>
          <section class="personal-info">
            <h3>Personal Info</h3>
            <ul>
              <li><label for="name">Name:</label><input type="text" name="name" id="name" placeholder="your full name" /></li>
              <li><label for="street-address">Street address:</label><input type="text" name="street-address" id="street-address" placeholder="your street address" /></li>
              <li><label for="city">City:</label><input type="text" name="city" id="city" placeholder="city" /></li>
              <li><label for="state">State:</label><select id="state" name="state">
                  <option value=""></option>
                  <option value="AL">Alabama</option>
                  <option value="AK">Alaska</option>
                  <option value="AZ">Arizona</option>
                  <option value="AR">Arkansas</option>
                  <option value="CA">California</option>
                  <option value="CO">Colorado</option>
                  <option value="CT">Connecticut</option>
                  <option value="DE">Delaware</option>
                  <option value="DC">District Of Columbia</option>
                  <option value="FL">Florida</option>
                  <option value="GA">Georgia</option>
                  <option value="HI">Hawaii</option>
                  <option value="ID">Idaho</option>
                  <option value="IL">Illinois</option>
                  <option value="IN">Indiana</option>
                  <option value="IA">Iowa</option>
                  <option value="KS">Kansas</option>
                  <option value="KY">Kentucky</option>
                  <option value="LA">Louisiana</option>
                  <option value="ME">Maine</option>
                  <option value="MD">Maryland</option>
                  <option value="MA">Massachusetts</option>
                  <option value="MI">Michigan</option>
                  <option value="MN">Minnesota</option>
                  <option value="MS">Mississippi</option>
                  <option value="MO">Missouri</option>
                  <option value="MT">Montana</option>
                  <option value="NE">Nebraska</option>
                  <option value="NV">Nevada</option>
                  <option value="NH">New Hampshire</option>
                  <option value="NJ">New Jersey</option>
                  <option value="NM">New Mexico</option>
                  <option value="NY">New York</option>
                  <option value="NC">North Carolina</option>
                  <option value="ND">North Dakota</option>
                  <option value="OH">Ohio</option>
                  <option value="OK">Oklahoma</option>
                  <option value="OR">Oregon</option>
                  <option value="PA">Pennsylvania</option>
                  <option value="RI">Rhode Island</option>
                  <option value="SC">South Carolina</option>
                  <option value="SD">South Dakota</option>
                  <option value="TN">Tennessee</option>
                  <option value="TX">Texas</option>
                  <option value="UT">Utah</option>
                  <option value="VT">Vermont</option>
                  <option value="VA">Virginia</option>
                  <option value="WA">Washington</option>
                  <option value="WV">West Virginia</option>
                  <option value="WI">Wisconsin</option>
                  <option value="WY">Wyoming</option>
                </select></li>
              <li><label for="zip-code">Zip code:</label><input type="text" name="zip-code" id="zip-code" placeholder="zip code" /></li>
              <li><label for="email">Email:</label><input type="email" name="email" id="email" placeholder="confirmation email" /></li>
              <li><label for="phone">Phone:</label><input type="tel" name="phone" id="phone" placeholder="your phone number" /></li>
            </ul>
          </section>
          <section class="Interests">
            <h3>Newsletter Interests</h3>
            <p>Which newsletters are you interested in recieving?</p>
            <ul>
              <li><input type="radio" id="features&editorials" name="newsletter"><label for="features&editorials">Features & Editorials</label></li>
              <li><input type="radio" id="fashion" name="newsletter"><label for="fashion">Fashion</label></li>
              <li><input type="radio" id="culture" name="newsletter"><label for="culture">Culture</label></li>
              <li><input type="radio" id="the-gallery" name="newsletter"><label for="the-gallery">The Gallery</label></li>
              <li><input type="radio" id="history" name="newsletter"><label for="history">History</label></li>
            </ul>
            <p>How would you like to recieve these newsletters?</p>
            <ul>
              <li>
                <input type="radio" id="email" name="delivery"><label for="email">Email</label></li><input type="radio" id="printed" name="delivery"><label for="printed">Printed and delivered</label>
              </li>
            </ul>
          </section>
          <section><button type="subscribe">Subscribe</button></section>
        </form>
      </main>
      <footer> All rights reserved.</footer>
    </div>
  </body>
</html>
